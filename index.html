<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Sneek – Nike Scraper Bot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding-top: 50px;
        }
        h1 {
            color: #111;
        }
        form {
            background-color: #fff;
            display: inline-block;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        input[type="text"] {
            padding: 10px;
            width: 250px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            border: none;
            background-color: #111;
            color: #fff;
            border-radius: 6px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>👟 Sneek – Nike Scraper Bot</h1>
    <form action="/scrape" method="POST">
        <input type="text" name="keyword" placeholder="Suchbegriff (z. B. Air Max)">
        <button type="submit">Scrapen</button>
    </form>
</body>
</html>
